; DÉSACTIVÉ : configuration héritée de SN Devis, mise en commentaire lors du passage à Cahier Bi.
; À réécrire pour le déploiement de Cahier Bi avant de le réactiver.
;
; [supervisord]
; nodaemon=true
; user=root
; logfile=/dev/null
; logfile_maxbytes=0
; pidfile=/run/supervisord.pid
;
; [program:php-fpm]
; command=php-fpm -F
; autostart=true
; autorestart=true
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0
;
; [program:nginx]
; command=nginx -g "daemon off;"
; autostart=true
; autorestart=true
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0
