; Logos et images : 2 Mo max côté validation Laravel
upload_max_filesize = 5M
post_max_size = 6M
; Génération des PDF (dompdf)
memory_limit = 256M
max_execution_time = 60
expose_php = Off

; Code figé dans l'image : pas de vérification des fichiers à chaque requête
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
